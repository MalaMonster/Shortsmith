name: Release

# Push a tag like v1.2.3 to build the Windows installer and publish a GitHub release.
# The app's auto-updater reads the latest release and its SHA256SUMS.txt.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          ./packaging/build.ps1 -Version $version -Python python

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Shortsmith ${{ github.ref_name }}
          body: |
            **Download `Shortsmith-Setup-X.Y.Z.exe` below** and run it — no admin rights needed.
            Already installed? Shortsmith offers this update automatically (Settings → Updates).
          generate_release_notes: true
          files: |
            dist/Shortsmith-Setup-*.exe
            dist/SHA256SUMS.txt
